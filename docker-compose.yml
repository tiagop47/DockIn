services:
  dockin-db:
    image: postgres:17-alpine
    container_name: dockin-postgres
    environment:
      POSTGRES_DB: dockin_db
      POSTGRES_USER: dockin_user
      POSTGRES_PASSWORD: dockin_password
    ports:
      - "5433:5432"
    volumes:
      - dockin_postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  dockin_postgres_data:
